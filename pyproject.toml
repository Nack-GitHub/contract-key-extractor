[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-ner"
version = "0.1.0"
description = "Key Information Extraction (NER + span post-processing) for English (CUAD) and Thai contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
    "seqeval>=1.2",
    "pandas>=2.0",
    "pyyaml>=6",
    "python-dateutil>=2.9",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# classical sequence-labelling baseline (conditional random field) for comparison
baseline = ["sklearn-crfsuite>=0.5", "joblib>=1.3"]
# Thai track: PyThaiNLP word segmentation + SentencePiece for WangchanBERTa
thai = ["pythainlp>=5.0", "sentencepiece>=0.2", "protobuf>=4"]
# demo web app and HTTP API (contract-ner serve); httpx is what FastAPI's test client runs on
demo = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
contract-ner = "contract_ner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_ner = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "E741", "B905", "RUF001", "RUF002", "RUF003", "RUF005", "RUF007"]  # long template strings, short loop names, zip() without strict, Thai text triggers the ambiguous-unicode rules
